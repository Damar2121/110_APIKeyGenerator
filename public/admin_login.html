<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-lg" style="width: 400px;">
        <h3 class="text-center mb-4">Admin Login</h3>
        
        <div id="loginAlert"></div>

        <form action="/api/admin/login" method="POST">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="admin_register.html">Belum punya akun? Register disini</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const alertDiv = document.getElementById('loginAlert');
        if(params.get('error') === 'wrongpass') alertDiv.innerHTML = '<div class="alert alert-danger">Password Salah</div>';
        if(params.get('error') === 'notfound') alertDiv.innerHTML = '<div class="alert alert-danger">Email tidak ditemukan</div>';
        if(params.get('registered') === 'true') alertDiv.innerHTML = '<div class="alert alert-success">Registrasi berhasil, silakan login</div>';
    </script>
</body>
</html>
