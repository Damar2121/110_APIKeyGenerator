<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar User Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Daftar User Baru</h4>
            </div>
            <div class="card-body">
                
                <div id="alertArea"></div>

                <form action="/api/user/register" method="POST" onsubmit="return validateForm()">
                    
                    <div class="mb-3">
                        <label class="form-label">Nama Depan</label>
                        <input type="text" name="firstName" class="form-control" placeholder="Contoh: Budi" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nama Belakang</label>
                        <input type="text" name="lastName" class="form-control" placeholder="Contoh: Santoso" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="nama@email.com" required>
                    </div>
                    
                    <hr class="my-4">

                    <div class="mb-3 p-3 bg-white border rounded">
                        <label class="form-label fw-bold">Generator API Key</label>
                        <p class="text-muted small mb-2">Klik tombol kuning untuk membuat kunci API Anda.</p>
                        
                        <div class="input-group mb-3">
                            <input type="text" id="apiKeyInput" name="apiKey" class="form-control font-monospace bg-light" placeholder="Belum ada key..." readonly required>
                            
                            <button type="button" class="btn btn-warning" onclick="generateUUID()">
                                ⚡ Generate Key
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                        Simpan Data & API Key
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script>
        // 1. Fungsi Generate UUID
        function generateUUID() {
            // Menggunakan API bawaan browser modern
            const key = crypto.randomUUID();
            
            // Masukkan ke kolom input
            const inputField = document.getElementById('apiKeyInput');
            inputField.value = key;
            
            // Efek visual sedikit (flash hijau border)
            inputField.classList.add('border-success');
            setTimeout(() => inputField.classList.remove('border-success'), 500);
        }

        // 2. Validasi Form (Mencegah submit jika belum generate)
        function validateForm() {
            const key = document.getElementById('apiKeyInput').value;
            if (!key) {
                alert("Mohon klik tombol 'Generate Key' terlebih dahulu!");
                return false; // Stop submit
            }
            return true; // Lanjut submit
        }

        // 3. Menangani Pesan dari Server (URL Parameter)
        const params = new URLSearchParams(window.location.search);
        const alertArea = document.getElementById('alertArea');

        if (params.get('status') === 'success') {
            alertArea.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>Berhasil!</strong> Data User dan API Key telah tersimpan.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
            // Bersihkan URL agar bersih saat direfresh
            window.history.replaceState(null, null, window.location.pathname);
        } 
        else if (params.get('status') === 'error') {
            alertArea.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Gagal!</strong> Email mungkin sudah terdaftar.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
