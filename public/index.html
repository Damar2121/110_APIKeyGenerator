<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar User Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Daftar User Baru</h4>
            </div>
            <div class="card-body">
                <div id="alertArea"></div>

                <form action="/api/user/register" method="POST">
                    <div class="mb-3">
                        <label>Nama Depan</label>
                        <input type="text" name="firstName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Nama Belakang</label>
                        <input type="text" name="lastName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    
                    <div class="mb-3 p-3 border rounded bg-light">
                        <label>Generator API Key</label>
                        <input type="text" class="form-control mb-2" value="Key akan muncul otomatis setelah submit" disabled>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Simpan Data & Generate Key</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Script untuk menampilkan pesan sukses dari URL Parameter
        const params = new URLSearchParams(window.location.search);
        const alertArea = document.getElementById('alertArea');

        if (params.get('status') === 'success') {
            const key = params.get('key');
            alertArea.innerHTML = `
                <div class="alert alert-success">
                    <strong>Berhasil!</strong> API Key Anda: <br>
                    <code class="fs-5">${key}</code> <br>
                    Simpan key ini karena tidak akan ditampilkan lagi.
                </div>`;
        } else if (params.get('status') === 'error') {
            alertArea.innerHTML = `<div class="alert alert-danger">Gagal! Email mungkin sudah terdaftar.</div>`;
        }
    </script>
</body>
</html>
