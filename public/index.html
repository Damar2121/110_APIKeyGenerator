<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - Pilih Akses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sedikit gaya tambahan agar kartu bisa diklik seluruhnya */
        .card-choice {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            height: 100%;
        }
        .card-choice:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
            border-color: #0d6efd;
        }
        .stretched-link::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 1;
            content: "";
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container text-center">
        <h1 class="mb-5 fw-bold text-dark">Selamat Datang di Sistem API Key</h1>
        
        <div class="row justify-content-center g-4">
            
            <div class="col-md-5 col-lg-4">
                <div class="card h-100 shadow-sm border-0 card-choice">
                    <div class="card-body p-5">
                        <div class="mb-4 text-success">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z"/>
                            </svg>
                        </div>
                        <h3 class="card-title">User Baru</h3>
                        <p class="card-text text-muted">Daftarkan diri Anda untuk mendapatkan API Key baru.</p>
                        <a href="register_user.html" class="btn btn-outline-success stretched-link mt-3">Masuk sebagai User</a>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4">
                <div class="card h-100 shadow-sm border-0 card-choice">
                    <div class="card-body p-5">
                        <div class="mb-4 text-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"/>
                            </svg>
                        </div>
                        <h3 class="card-title">Admin</h3>
                        <p class="card-text text-muted">Login ke dashboard untuk mengelola data user.</p>
                        <a href="admin_login.html" class="btn btn-outline-primary stretched-link mt-3">Masuk sebagai Admin</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
