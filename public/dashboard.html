<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container mt-5">
        <h3>Daftar User & API Key</h3>
        <div class="table-responsive mt-3">
            <table class="table table-striped table-bordered" id="userTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID User</th>
                        <th>Nama Depan</th>
                        <th>Nama Belakang</th>
                        <th>Email</th>
                        <th>API Key</th>
                        <th>Status Key</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil data dari server
        async function loadData() {
            try {
                const response = await fetch('/api/dashboard/data');
                
                // Jika belum login (401), lempar kembali ke login
                if (response.status === 401) {
                    window.location.href = '/admin_login.html';
                    return;
                }

                const users = await response.json();
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = ''; // Kosongkan tabel

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada data.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    
                    // Tentukan warna badge status
                    let badgeClass = user.Status_Key.includes('Nonaktif') ? 'bg-danger' : 'bg-success';

                    row.innerHTML = `
                        <td>${user.ID}</td>
                        <td>${user.First_name}</td>
                        <td>${user.Last_name}</td>
                        <td>${user.Email}</td>
                        <td style="font-family: monospace;">${user.ApiKey}</td>
                        <td><span class="badge ${badgeClass}">${user.Status_Key}</span></td>
                        <td>
                            <button onclick="deleteUser(${user.KeyId})" class="btn btn-danger btn-sm">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Fungsi Delete User
        async function deleteUser(id) {
            if (!confirm('Yakin hapus user ini?')) return;

            try {
                const response = await fetch(`/api/user/delete/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    loadData(); // Refresh data tabel
                } else {
                    alert('Gagal menghapus data');
                }
            } catch (error) {
                alert('Terjadi kesalahan');
            }
        }

        // Jalankan saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
